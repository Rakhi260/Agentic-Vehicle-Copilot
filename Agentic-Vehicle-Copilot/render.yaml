services:
  - type: web
    name: agentic-vehicle-copilot
    runtime: python
    plan: free

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      # Set the values in the Render dashboard (Environment tab), never in this file.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

    buildCommand: pip install -r requirement.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health
